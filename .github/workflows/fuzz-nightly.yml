# Longer fuzzing stays separate from fast push/PR checks. The saved corpus lets
# successive runs build on useful discoveries without committing generated bytes.
name: Extended fuzzing
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: extended-fuzz-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y clang
      - uses: actions/cache/restore@v4
        id: corpus
        with:
          path: bin/fuzz/corpus
          key: fuzz-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fuzz-${{ runner.os }}-${{ runner.arch }}-
      - run: make FUZZ_CC=clang fuzz
      - run: python3 tests/run_fuzz.py bin/fuzz/coffin-fuzz --seconds 1800
      # Save coverage discoveries even when a crash ends the run early.
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: bin/fuzz/corpus
          key: ${{ steps.corpus.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: extended-fuzz-diagnostics
          path: bin/fuzz/
          retention-days: 14
          if-no-files-found: ignore
